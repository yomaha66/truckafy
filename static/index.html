<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRUCK-A-FY</title>
<meta name="description" content="Type anything. Get the monster-truck-rally-commercial treatment.">
<meta name="theme-color" content="#0c0a0e">
<style>
  @font-face { font-family:"Press Start 2P"; src:url(/fonts/PressStart2P-Regular.ttf) format("truetype"); font-display:swap; }
  :root { --bg:#0c0a0e; --panel:#17131b; --line:#3a2a40; --ink:#f4f0ea; --dim:#9a8f8a; --px:"Press Start 2P", "Courier New", monospace;
          /*PALETTE*/--sun:#ffcf1e; --hot:#ff7a00; --rust:#5a1200; --glow:255,90,0; --btn-ink:#1a0d00;/*/PALETTE*/ }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { min-height:100dvh; display:flex; flex-direction:column; align-items:center; padding:max(18px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 4px),
                radial-gradient(60% 40% at 50% 100%, rgba(var(--glow),.28), transparent 70%), var(--bg); }
  .wrap { width:100%; max-width:560px; }
  .logo { display:block; width:100%; height:auto; margin:22px auto 14px; image-rendering:pixelated; }
  .tag { text-align:center; color:var(--sun); font-family:var(--px); font-size:clamp(10px, 2.6vw, 13px); line-height:1.6; margin:0 0 26px; text-shadow:2px 2px 0 var(--rust); }
  textarea { width:100%; min-height:120px; resize:vertical; background:var(--panel); color:var(--ink); border:3px solid var(--line); border-radius:0; padding:16px; font-size:18px; line-height:1.35; outline:none; box-shadow:4px 4px 0 #000; }
  textarea:focus { border-color:var(--sun); }
  .row { display:flex; justify-content:space-between; align-items:center; margin:12px 2px 16px; color:var(--dim); font-family:var(--px); font-size:9px; }
  select { background:var(--panel); color:var(--ink); border:2px solid var(--line); border-radius:0; padding:6px 8px; font-family:var(--px); font-size:9px; }
  button.go { width:100%; padding:20px 12px; border:3px solid #000; border-radius:0; font-family:var(--px); font-size:clamp(14px, 3.8vw, 18px); color:var(--btn-ink); cursor:pointer;
    background:linear-gradient(var(--sun) 0 50%, var(--hot) 50% 100%); box-shadow:6px 6px 0 var(--rust); text-transform:uppercase; text-shadow:2px 2px 0 rgba(255,255,255,.35); }
  button.go:active { transform:translate(3px, 3px); box-shadow:3px 3px 0 var(--rust); }
  button.go:disabled { opacity:.6; cursor:wait; transform:none; }
  .status { min-height:24px; text-align:center; color:var(--dim); margin:18px 0 6px; font-size:15px; }
  .status.err { color:#ff7a7a; }
  .out { display:none; margin-top:16px; background:var(--panel); border:3px solid var(--line); border-radius:0; padding:12px; box-shadow:4px 4px 0 #000; }
  .out.show { display:block; }
  video { width:100%; border-radius:0; background:#000; display:block; border:2px solid #000; }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .actions button, .actions a { padding:16px 8px; border-radius:0; border:2px solid var(--line); background:#221b28; color:var(--ink); font-family:var(--px); font-size:10px; line-height:1.4; text-align:center; text-decoration:none; cursor:pointer; text-transform:uppercase; box-shadow:3px 3px 0 #000; }
  .actions button:active, .actions a:active { transform:translate(2px, 2px); box-shadow:1px 1px 0 #000; }
  .actions .share { background:linear-gradient(var(--sun) 0 50%, var(--hot) 50% 100%); color:var(--btn-ink); border-color:#000; }
  .foot { margin-top:auto; padding-top:28px; color:#5d5459; font-family:var(--px); font-size:8px; line-height:1.8; text-align:center; }
  @keyframes rev { 0%{transform:scaleX(.2)} 50%{transform:scaleX(1)} 100%{transform:scaleX(.2)} }
  .bar { height:8px; background:repeating-linear-gradient(90deg, var(--sun) 0 8px, var(--hot) 8px 16px); margin:12px auto 0; width:60%; transform-origin:center; animation:rev 1s steps(6) infinite; display:none; border:2px solid #000; }
  .bar.on { display:block; }
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="/logo.svg" alt="TRUCK-A-FY" width="95" height="16">
  <p class="tag">SUNDAY! SUNDAY! SUNDAY!</p>

  <textarea id="text" maxlength="200" placeholder="Type anything. A text to your wife. A grocery list. A reminder to floss." autocomplete="off"></textarea>
  <div class="row">
    <span id="count">0 / 200</span>
    <label>Intro
      <select id="intro">
        <option value="auto">Surprise me</option>
        <option value="first">My first word ×3</option>
        <option value="arena">Arena classic</option>
        <option value="none">None</option>
      </select>
    </label>
  </div>
  <button class="go" id="go">Truck-a-fy it</button>
  <div class="bar" id="bar"></div>
  <div class="status" id="status"></div>

  <div class="out" id="out">
    <video id="video" controls playsinline preload="metadata"></video>
    <div class="actions">
      <button class="share" id="share">Share</button>
      <a id="download" download="truckafy.mp4">Save video</a>
      <button id="again">Run it again</button>
      <a id="mp3" download="truckafy.mp3">Audio only</a>
    </div>
  </div>

  <div class="foot">ONE ANNOUNCER. ZERO RESTRAINT.<br>YOUR WORDS, READ EXACTLY AS TYPED.</div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const text = $('text'), count = $('count'), go = $('go'), bar = $('bar'), status = $('status');
  const out = $('out'), video = $('video'), share = $('share'), dl = $('download'), again = $('again'), mp3 = $('mp3');
  let blob = null, url = null, lastText = '', lastIntro = 'auto';
  const lines = ['Warming up the announcer…', 'Revving the engines…', 'Lighting the pyro…', 'Screaming into the microphone…', 'Adding the tire screech…'];

  text.addEventListener('input', () => { count.textContent = `${text.value.length} / 200`; });
  try { const saved = localStorage.getItem('truckafy.last'); if (saved) { text.value = saved; count.textContent = `${saved.length} / 200`; } } catch (e) {}

  async function run(reroll) {
    const t = text.value.trim();
    if (!t) { status.className = 'status err'; status.textContent = 'Type something first.'; return; }
    try { localStorage.setItem('truckafy.last', t); } catch (e) {}
    lastText = t; lastIntro = $('intro').value;
    go.disabled = true; bar.classList.add('on'); out.classList.remove('show'); status.className = 'status';
    let i = 0; status.textContent = lines[0];
    const tick = setInterval(() => { i = (i + 1) % lines.length; status.textContent = lines[i]; }, 2200);
    try {
      const body = { text: t, intro: lastIntro, format: 'mp4' };
      if (reroll) body.seed = Math.floor(Math.random() * 1e9);
      const r = await fetch('/truckafy', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!r.ok) { let msg = 'Something broke.'; try { msg = (await r.json()).error || msg; } catch (e) {} throw new Error(msg); }
      blob = await r.blob();
      if (url) URL.revokeObjectURL(url);
      url = URL.createObjectURL(blob);
      video.src = url; dl.href = url;
      mp3.href = '/truckafy?text=' + encodeURIComponent(t) + '&intro=' + lastIntro;
      out.classList.add('show'); status.textContent = '';
      try { await video.play(); } catch (e) {}
      out.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } catch (e) {
      status.className = 'status err'; status.textContent = e.message || 'Something broke.';
    } finally {
      clearInterval(tick); go.disabled = false; bar.classList.remove('on');
    }
  }
  go.addEventListener('click', () => run(false));
  again.addEventListener('click', () => run(true));
  text.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) run(false); });

  share.addEventListener('click', async () => {
    if (!blob) return;
    const file = new File([blob], 'truckafy.mp4', { type: 'video/mp4' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'TRUCK-A-FY', text: lastText }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    dl.click();
  });
})();
</script>
</body>
</html>
